[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.86"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
url = { version = "2", features = ["serde"] }
tempfile = "3"
dbfork-model = { path = "crates/model" }
dbfork-config = { path = "crates/config" }
dbfork-git = { path = "crates/git" }
dbfork-env = { path = "crates/env" }
dbfork-engines = { path = "crates/engines" }
dbfork-providers = { path = "crates/providers" }
dbfork-core = { path = "crates/core" }
